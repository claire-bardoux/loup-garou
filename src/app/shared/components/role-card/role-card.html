<article class="role-card" [routerLink]="['/roles', role().id]" tabindex="0">
  <div class="role-image-container">
    <img [src]="role().image" [alt]="role().name" class="role-image" />
  </div>

  <h2 class="role-name">
    {{ role().name }}
  </h2>

  <span
    class="role-team"
    [class.village]="role().team === 'village'"
    [class.loup]="role().team === 'loup'"
    [class.solitaire]="role().team === 'solitaire'"
  >
    {{ role().team }}
  </span>
</article>
