<main class="library">

  <div class="search">

    <span class="search-icon">⌕</span>

    <input
      type="search"
      placeholder="Rechercher un rôle"
      [value]="search()"
      (input)="search.set($any($event.target).value)"
    />

  </div>


  <nav class="filters">

    <button
      [class.active]="selectedFilter() === 'tous'"
      (click)="selectFilter('tous')"
    >
      Tous
    </button>

    <button
      [class.active]="selectedFilter() === 'loup'"
      (click)="selectFilter('loup')"
    >
      Loups
    </button>

    <button
      [class.active]="selectedFilter() === 'village'"
      (click)="selectFilter('village')"
    >
      Village
    </button>

    <button
      [class.active]="selectedFilter() === 'solitaire'"
      (click)="selectFilter('solitaire')"
    >
      Solitaires
    </button>

  </nav>


  <section class="roles-grid">

    @for (role of filteredRoles(); track role.id) {

      <app-role-card
        [role]="role"
      />

    }

  </section>

</main>
